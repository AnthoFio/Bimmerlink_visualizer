name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the jobs only need to read the repository.
permissions:
  contents: read

# A newer run for the same PR / branch supersedes the older one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NO_COLOR: '1' # plain, grep-able output for humans and agents
  HUSKY: '0' # no git hooks in CI (the `prepare` script would install them)

jobs:
  # The job name is what branch protection matches on: require the check named `CI`.
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node (version from .nvmrc, npm cache)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gate (lint, format check, typecheck, unit tests)
        run: npm run check

      - name: Build
        run: npm run build

      - name: Install the e2e browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (production build, Example logs)
        run: npm run e2e

      - name: Upload screenshots and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  # The performance budgets (docs/performance.md). Non-blocking for now: CI machines vary, so a
  # slow run shows up in the log and the artifact without failing the required check `CI`.
  perf:
    name: Performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node (version from .nvmrc, npm cache)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install the e2e browser
        run: npx playwright install --with-deps chromium

      - name: Performance test (production build, one worker)
        run: npm run e2e:perf

      - name: Upload the measured numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: test-results/**/perf.json
          if-no-files-found: warn
          retention-days: 30
